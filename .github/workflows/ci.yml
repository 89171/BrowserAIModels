name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Covers check:i18n through prebuild, and fails if a catalog reference,
      # a translation key or a static route stops resolving.
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://browseraimodels.xyz
